<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
*{box-sizing:border-box}body{margin:0;color:#392f28;background:#faf8f5;font:14px Arial,'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #876548;outline-offset:3px}header{padding:28px 4vw;border-bottom:1px solid #ddd7cf}.eyebrow{font-size:11px;letter-spacing:3px;color:#796e64}h1{margin:12px 0;font-size:32px}p{line-height:1.6}#meta{color:#74695f}.tools{display:flex;flex-wrap:wrap;gap:10px;padding:18px 4vw;background:#fff;border-bottom:1px solid #ddd7cf}.tools input[type=search]{flex:1;min-width:200px}.tools input,.tools select,.tools button{padding:10px;border:1px solid #ccc4bb;background:white}.tools label{display:flex;align-items:center;white-space:nowrap;gap:5px}.tools input[type=checkbox]{width:16px;height:16px;accent-color:#514035}#notice{padding:0 4vw;color:#86612e}.summary{padding:22px 4vw;color:#76695e;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 18px;padding:0 4vw}.photo{aspect-ratio:3/4;background:#eee9e3;width:100%;border:0;padding:0;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.card h2{font-size:14px;font-weight:400;line-height:1.5;margin:12px 0 7px}.price{font-weight:700;font-size:19px}.stock{font-size:11px;color:#796e64;margin:8px 0}.imagewrap{position:relative}.heart{position:absolute;bottom:10px;right:10px;border:0;border-radius:50%;width:34px;height:34px;background:#fff;font-size:20px}.pager{display:flex;gap:16px;align-items:center;justify-content:center;padding:36px}.pager button{padding:12px 20px;background:#fff;border:1px solid #ccc}.pager button:disabled{opacity:.35}footer{margin:20px 4vw;padding:20px 0;border-top:1px solid #ddd;color:#76695e;font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:60px}.wide .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide .photo{max-height:85vh}dialog{width:min(1000px,94vw);max-height:94vh;overflow:auto;border:0;padding:0;background:#faf8f5}dialog::backdrop{background:#0009}.detail{display:grid;grid-template-columns:1.1fr 1fr}.detail img{width:100%;height:82vh;object-fit:contain;background:#eee9e3}.detail article{padding:50px 28px 30px}.detail h2{font-weight:400;line-height:1.4}.close{position:absolute;right:10px;top:10px;font-size:24px;width:38px;height:38px;background:white;border:1px solid #ccc}.detail select{padding:10px;width:100%;margin:18px 0}.detail a{display:inline-block;color:#514035;margin-top:24px}.detail .stock{line-height:1.7}#favorite{padding:13px;width:100%;border:0;background:#514035;color:#fff}.none{display:none!important}
@media(max-width:750px){h1{font-size:25px}header{padding:22px 4vw}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}.card h2{font-size:12px}.price{font-size:16px}.tools input[type=search]{flex:0 0 100%;width:100%}.tools select{flex:1 1 calc(50% - 10px);min-width:0;width:45%}.tools label{font-size:12px}.wide .grid{grid-template-columns:1fr}.detail{display:block}.detail img{height:58vh}.detail article{padding:22px}.pager{gap:8px}.pager button{padding:11px}.summary{padding-top:16px}}
</style></head><body><header><div class="eyebrow">OFFLINE SHOP CATALOG</div><h1>__TITLE__</h1><div id="meta"></div></header><section class="tools" aria-label="商品筛选"><input type="search" id="search" placeholder="搜索商品名称、颜色或品类" aria-label="搜索"><select id="collection" aria-label="分类"><option value="">全部分类</option></select><select id="currency" aria-label="币种"><option value="">全部币种</option></select><select id="sort" aria-label="排序"><option value="default">默认顺序</option><option value="low">价格从低到高（按币种分组）</option><option value="high">价格从高到低（按币种分组）</option><option value="name">名称 A–Z</option></select><label><input type="checkbox" id="available">有货</label><label><input type="checkbox" id="saved">收藏</label><button id="view" aria-pressed="false">大图模式</button><button id="reset">重置</button></section><p id="notice"></p><div class="summary" id="count" aria-live="polite"></div><main class="grid" id="grid"></main><nav class="pager" aria-label="分页"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav><footer><p id="saveStatus" aria-live="polite"></p>图片与数据保存在本地。价格和库存为抓取快照；不同币种不换算。点击原商品链接需要联网。缺失图片和抓取范围见 report.json。<br>收藏保存在当前浏览器，部分本地文件预览器不支持持久保存。手机也可使用随包提供的 PDF（若已启用导出）。</footer><dialog id="modal" aria-label="商品详情"><button class="close" aria-label="关闭">×</button><div class="detail"><img id="detailImage" alt=""><article><div class="eyebrow">PRODUCT DETAILS</div><h2 id="detailTitle"></h2><div class="price" id="detailPrice"></div><p class="stock" id="detailStock"></p><select id="variant" aria-label="尺码选项"></select><p class="stock" id="variantInfo"></p><button id="favorite"></button><a id="source" target="_blank" rel="noopener noreferrer">查看官网 ↗（需要联网）</a></article></div></dialog><script id="catalog-data" type="application/json">__DATA__</script><script>
'use strict';
const {products:PRODUCTS,report}=JSON.parse(document.getElementById('catalog-data').textContent);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const price=p=>p.price==null?'价格未提供':(p.currency||'币种未提供')+' '+Number(p.price).toLocaleString('en-US',{minimumFractionDigits:2})+(p.max_price!=null&&p.max_price!==p.price?' – '+Number(p.max_price).toLocaleString('en-US',{minimumFractionDigits:2}):'');
const stock=p=>p.available===true?'抓取时有货':p.available===false?'抓取时售罄':'库存未提供';
let favorites=new Set;try{favorites=new Set(JSON.parse(localStorage.getItem('offline-shop-favorites')||'[]'))}catch{}let page=1,current=null;const pageSize=48;
$('meta').textContent=PRODUCTS.length+' 条商品 · '+report.fetched_at.slice(0,10)+' · 离线浏览';
$('notice').textContent=report.status==='partial'?'本目录为部分结果：可能达到抓取上限，或部分来源/图片失败。详情见 report.json。':'';
function options(id,values){values.forEach(value=>{let o=document.createElement('option');o.value=value;o.textContent=value;$(id).appendChild(o)})}
options('collection',[...new Set(PRODUCTS.flatMap(p=>p.collections))]);options('currency',[...new Set(PRODUCTS.map(p=>p.currency||'币种未提供'))]);
function toggle(id){favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem('offline-shop-favorites',JSON.stringify([...favorites]))}catch{$('saveStatus').textContent='当前预览器无法持久保存收藏；本次会话仍可使用。'}render();if(current)favoriteLabel()}
function favoriteLabel(){$('favorite').textContent=favorites.has(current.id)?'♥ 已收藏':'♡ 收藏商品'}
function render(){const q=$('search').value.trim().toLowerCase();let list=PRODUCTS.filter(p=>(!q||(p.title+' '+p.type).toLowerCase().includes(q))&&(!$('collection').value||p.collections.includes($('collection').value))&&(!$('currency').value||(p.currency||'币种未提供')===$('currency').value)&&(!$('available').checked||p.available===true)&&(!$('saved').checked||favorites.has(p.id)));const mode=$('sort').value;if(mode==='name')list.sort((a,b)=>a.title.localeCompare(b.title));if(mode==='low'||mode==='high')list.sort((a,b)=>{const c=(a.currency||'~').localeCompare(b.currency||'~');if(c)return c;if(a.price==null)return b.price==null?0:1;if(b.price==null)return -1;return mode==='low'?a.price-b.price:b.price-a.price});const pages=Math.max(1,Math.ceil(list.length/pageSize));page=Math.min(page,pages);$('count').textContent=list.length+' 条商品 · 点击图片放大';$('page').textContent=page+' / '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;$('grid').innerHTML=list.slice((page-1)*pageSize,page*pageSize).map(p=>'<article class="card"><div class="imagewrap"><button class="photo" data-open="'+p.id+'" aria-label="查看 '+esc(p.title)+'">'+(p.image?'<img loading="lazy" decoding="async" src="'+esc(p.image)+'" alt="'+esc(p.title)+'">':'<span>图片未下载</span>')+'</button><button class="heart" data-fav="'+p.id+'" aria-label="收藏 '+esc(p.title)+'" aria-pressed="'+favorites.has(p.id)+'">'+(favorites.has(p.id)?'♥':'♡')+'</button></div><h2>'+esc(p.title)+'</h2><div class="price">'+esc(price(p))+'</div><p class="stock">'+esc(stock(p))+'</p></article>').join('')||'<p class="empty">没有符合条件的商品</p>'}
function show(id){current=PRODUCTS.find(p=>p.id===id);$('detailTitle').textContent=current.title;$('detailPrice').textContent=price(current);$('detailStock').textContent=stock(current);$('detailImage').classList.toggle('none',!current.image);if(current.image)$('detailImage').src=current.image;$('detailImage').alt=current.title;$('source').href=current.url;$('variant').innerHTML='<option value="">选择尺码 / 选项</option>'+current.variants.map((v,i)=>'<option value="'+i+'">'+esc(v.title)+'</option>').join('');$('variant').classList.toggle('none',!current.variants.length);$('variantInfo').textContent=current.variants.length?'选择选项查看对应快照':'此来源未提供完整尺码明细。';favoriteLabel();$('modal').showModal()}
$('variant').onchange=()=>{if($('variant').value===''){$('detailPrice').textContent=price(current);return}const v=current.variants[+$('variant').value];$('detailPrice').textContent=price({...v,currency:current.currency,max_price:v.price});$('variantInfo').textContent=stock(v)};
$('grid').onclick=e=>{const a=e.target.closest('[data-open]'),b=e.target.closest('[data-fav]');if(a)show(a.dataset.open);if(b)toggle(b.dataset.fav)};$('favorite').onclick=()=>toggle(current.id);document.querySelector('.close').onclick=()=>$('modal').close();$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').close()};
function apply(){page=1;render()}$('search').oninput=apply;['collection','currency','sort','available','saved'].forEach(id=>$(id).onchange=apply);$('reset').onclick=()=>{$('search').value='';$('collection').value='';$('currency').value='';$('sort').value='default';$('available').checked=false;$('saved').checked=false;apply()};$('prev').onclick=()=>{page--;render();$('count').scrollIntoView()};$('next').onclick=()=>{page++;render();$('count').scrollIntoView()};$('view').onclick=()=>{const on=document.body.classList.toggle('wide');$('view').setAttribute('aria-pressed',on);$('view').textContent=on?'标准模式':'大图模式'};render();
</script></body></html>
